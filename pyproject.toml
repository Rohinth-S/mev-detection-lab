[project]
name = "mev-detection-lab"
version = "0.1.0"
description = "Reproducible quantitative research system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.scripts]
mev_detection_lab = "mev_lab.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
