[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mev-detection-lab"
version = "0.2.0"
description = "Retrospective transaction order and receipt audit"
requires-python = ">=3.11"
dependencies = ["eth-abi>=5.1", "pydantic>=2.9", "web3>=7.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mev_detection_lab = "mev_lab.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
